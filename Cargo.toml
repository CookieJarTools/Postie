[package]
name = "postie"
version = "0.1.2"
edition = "2024"
description = "A desktop mail client that sits in the tray and tells you when mail arrives."
authors = ["Joseph Cook"]
license-file = "LICENSE.md"
repository = "https://github.com/CookieJarTools/Postie"
publish = false

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "links", "clipboard"] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
env_logger = "0.11.11"
futures = "0.3.34"
html2text = { version = "0.17.4", features = ["css"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ksni = "0.3.7"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
log = "0.4.34"
mail-parser = "0.11"
notify-rust = "4.18.2"
open = "5.4.5"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
